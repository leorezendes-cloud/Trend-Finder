name: Plug ATS and O-U shortlist checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'plug_ou_*.py'
      - 'plug_ats_v5_*.py'
      - 'test_plug_ats_v5_selection.py'
      - 'test_plug_ats_v5_issue.py'
      - 'plug_dashboard.py'
      - 'expert_beta.py'
      - 'expert_beta_cli.py'
      - 'fan_views.py'
      - 'weekly_results.py'
      - 'hosted_updates.py'
      - 'templates/**'
      - 'static/expert_beta.css'
      - 'test_plug_pick_summary_ui.py'
      - '.github/workflows/plug-ou-shortlist.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shortlist-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test dependencies
        run: python -m pip install Flask==3.1.3 Werkzeug==3.1.9
      - name: Syntax-check modified modules
        run: |
          python -m compileall -q plug_ats_v5_model.py plug_ats_v5_weekly.py plug_ou_shortlist.py plug_ou_weekly.py plug_ou_all_qualifiers.py plug_ou_weekly_v3.py plug_ou_receipts.py plug_dashboard.py fan_views.py expert_beta.py expert_beta_cli.py weekly_results.py hosted_updates.py
      - name: Regression tests for no-hindsight selection
        run: python -m unittest test_plug_ats_v5_issue test_plug_ats_v5_selection test_plug_pick_summary_ui test_plug_ou_weekly test_plug_ou_all_qualifiers test_plug_ou_receipts test_plug_totals_policy test_plug_v14_model -v
      - name: Install full application dependencies
        run: python -m pip install -r requirements.txt
      # Legacy dashboard/editorial suites contain preexisting fixture assumptions
      # about pending forecasts and CSS markup; those need a separate baseline audit.
      - name: Verify weekly results, Expert pipeline, prediction cards and hosted worker
        run: python -m unittest test_weekly_results test_expert_pipeline_e2e test_prediction_cards test_hosted_updates -q
      - name: Jinja2 syntax validation of all affected templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          for p in (
              'templates/expert_dashboard.html',
              'templates/_comparison_prediction.html',
              'templates/expert_game.html',
              'templates/expert_game_mobile.html',
              'templates/prediction_results.html',
              'templates/sunday_results.html',
          ):
              Environment().parse(Path(p).read_text())
              print('validated:',p)
          PY
