name: Expert owner review and newsletter draft safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'expert_review_web.py'
      - 'test_expert_review_workflow.py'
      - 'newsletter.py'
      - 'templates/expert_review_*.html'
      - '.github/workflows/expert-owner-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expert-owner-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install Flask==3.1.3 Werkzeug==3.1.9
      - name: Syntax and template verification
        run: |
          python -m py_compile expert_review_web.py newsletter.py test_expert_review_workflow.py
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          for name in ('templates/expert_review_queue.html', 'templates/expert_review_detail.html'):
              Environment().parse(Path(name).read_text())
              print('Validated:', name)
          PY
      - name: Focused safety tests
        run: python -m unittest test_expert_review_workflow -v
