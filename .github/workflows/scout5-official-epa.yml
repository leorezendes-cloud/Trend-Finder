name: Scout 5 official EPA refresh

on:
  workflow_dispatch:
  schedule:
    # 7:00 AM New York time is 11:00 UTC in summer and 12:00 UTC in winter.
    # Hourly Wednesday-Saturday daylight hours covers both DST offsets and
    # retries a delayed provider publication. GitHub schedule may run late.
    - cron: "0 11-23 * * 3,4,5,6"

permissions:
  contents: write

concurrency:
  group: scout5-official-epa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Parquet reader (CI only, not Render)
        run: python -m pip install pyarrow
      - name: Check and append complete SportsDataverse weeks
        run: python scout5_refresh_bundle.py
      - name: Validate Scout 5 replay, ratings and runtime
        run: |
          python -m unittest -q test_scout5_replacement
          python - <<'PY'
          from scout5_totals import load_bundle
          doc = load_bundle("scout5_ou_bundle.json")
          assert len(doc["replay_history"]) == 70
          assert sum(r["grades"]["ou"] == "Win" for r in doc["replay_history"]) == 44
          assert sum(r["grades"]["ou"] == "Loss" for r in doc["replay_history"]) == 26
          assert all(len(teams) == 32 for teams in doc["ratings"].values())
          print("Scout 5 replay and complete EPA snapshots verified")
          PY
      - name: Commit updated EPA snapshots only when changed
        run: |
          if git diff --quiet -- scout5_ou_bundle.json; then
            echo "No new ratings; nothing to deploy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scout5_ou_bundle.json
          git commit -m "Update Scout 5 official SportsDataverse EPA ratings"
          git push
