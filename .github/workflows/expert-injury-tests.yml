name: Expert injury evidence tests
on:
  pull_request:
    paths:
      - 'expert_matchup_evidence.py'
      - 'expert_official_injury_collect.py'
      - 'test_expert_official_injury_collect.py'
      - 'test_expert_matchup_evidence.py'
      - '.github/workflows/expert-injury-tests.yml'
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_expert_matchup_evidence test_expert_official_injury_collect
