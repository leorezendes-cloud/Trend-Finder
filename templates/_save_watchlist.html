{% macro save_item(kind,target,title,button_label=none) %}
{% if g.member %}<form class="save-watchlist" action="{{ url_for('membership.save_watchlist') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="kind" value="{{ kind }}"><input type="hidden" name="target" value="{{ target }}"><input type="hidden" name="title" value="{{ title }}"><button type="submit">{{ button_label if button_label is not none else ('Save ' ~ ('team' if kind=='team' else 'trend') ~ ' to My Watchlist') }}</button></form>{% else %}<p><a href="{{ url_for('membership.login') }}">Sign in to save {{ 'this team' if kind=='team' else 'this trend' }}</a></p>{% endif %}
{% endmacro %}
