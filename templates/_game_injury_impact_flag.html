{# Compact marker; native title exposes details without nesting an interactive disclosure in a score-card summary. #}
<link rel="stylesheet" href="{{ url_for('static', filename='injury_impact.css') }}">
{% set injury_impact = injury_impact_for_game(game.game_id) %}
{% if injury_impact %}
<span class="game-injury-impact" role="img" aria-label="Injury impact: {{ injury_impact.title }}" title="{{ injury_impact.title }} — {{ injury_impact.details }}">⚑ Injury impact</span>
{% endif %}
