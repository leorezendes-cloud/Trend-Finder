{% if seo %}
<meta name="description" content="{{ seo.description }}">
<meta name="robots" content="{{ 'index, follow' if seo.indexable else 'noindex, follow' }}">
{% if seo.canonical %}<link rel="canonical" href="{{ seo.canonical }}">{% endif %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="TrendFindah">
<meta property="og:title" content="{{ seo.title or 'TrendFindah' }}">
<meta property="og:description" content="{{ seo.description }}">
{% if seo.canonical %}<meta property="og:url" content="{{ seo.canonical }}">{% endif %}
<meta property="og:image" content="{{ seo.image }}">
<meta property="og:image:alt" content="Trend Findah gold graffiti logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo.title or 'TrendFindah' }}">
<meta name="twitter:description" content="{{ seo.description }}">
<meta name="twitter:image" content="{{ seo.image }}">
{% if request.endpoint=='home' %}<script type="application/ld+json">{{ {'@context':'https://schema.org','@type':'WebSite','name':'Trend Findah','alternateName':'Trend Findah','url':seo.origin+'/'}|tojson }}</script>{% endif %}
{% endif %}
